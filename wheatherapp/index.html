<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atmosphera — Weather</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0c14;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #e8e8f0;
      --muted: rgba(232,232,240,0.45);
      --accent: #7eb8f7;
      --accent2: #f7c47e;
      --glow: rgba(126,184,247,0.18);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 60px;
      overflow-x: hidden;
    }

    /* Animated background orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      animation: drift 18s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    .orb1 { width: 520px; height: 520px; background: #3a7bd5; top: -140px; left: -100px; animation-delay: 0s; }
    .orb2 { width: 400px; height: 400px; background: #f7a84e; bottom: -80px; right: -80px; animation-delay: -6s; }
    .orb3 { width: 300px; height: 300px; background: #7eb8f7; top: 40%; left: 50%; animation-delay: -12s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.08); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 44px;
      animation: fadeDown 0.8s ease both;
    }
    @keyframes fadeDown {
      from { opacity:0; transform: translateY(-20px); }
      to   { opacity:1; transform: translateY(0); }
    }
    header .logo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: -0.5px;
      background: linear-gradient(120deg, #e8e8f0 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header .tagline {
      font-size: 0.82rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Search */
    .search-wrap {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
      animation: fadeDown 0.8s 0.1s ease both;
    }
    .search-wrap input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 22px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      backdrop-filter: blur(12px);
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow);
    }
    .search-wrap button {
      background: linear-gradient(135deg, #4a90e2, #7eb8f7);
      border: none;
      border-radius: 14px;
      padding: 16px 28px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }
    .search-wrap button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(74,144,226,0.4);
    }
    .search-wrap button:active { transform: translateY(0); }

    /* Error */
    .error-msg {
      text-align: center;
      color: #f7877e;
      font-size: 0.9rem;
      margin-bottom: 20px;
      display: none;
    }

    /* Loading spinner */
    .spinner {
      display: none;
      text-align: center;
      margin: 30px 0;
    }
    .spinner .ring {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Cards */
    .weather-content { display: none; }

    .main-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 40px;
      backdrop-filter: blur(20px);
      margin-bottom: 20px;
      animation: fadeUp 0.6s ease both;
      position: relative;
      overflow: hidden;
    }
    .main-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(24px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .location-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
    }
    .location-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      line-height: 1.2;
    }
    .location-region {
      font-size: 0.83rem;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }
    .local-time {
      text-align: right;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .temp-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 16px;
    }
    .temp-big {
      font-family: 'Playfair Display', serif;
      font-size: clamp(4rem, 12vw, 6rem);
      line-height: 1;
      background: linear-gradient(135deg, #fff 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .weather-icon {
      width: 80px; height: 80px;
      filter: drop-shadow(0 0 18px rgba(126,184,247,0.35));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    .condition-text {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .feels-like {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* Condition badge */
    .condition-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-top: 12px;
      border: 1px solid;
    }
    .badge-sunny  { background: rgba(247,196,126,0.12); border-color: rgba(247,196,126,0.3); color: var(--accent2); }
    .badge-cloudy { background: rgba(180,180,220,0.1);  border-color: rgba(180,180,220,0.25); color: #c0c0e0; }
    .badge-rainy  { background: rgba(126,184,247,0.1);  border-color: rgba(126,184,247,0.3);  color: var(--accent); }
    .badge-snowy  { background: rgba(200,230,255,0.1);  border-color: rgba(200,230,255,0.25); color: #cce8ff; }
    .badge-stormy { background: rgba(255,100,100,0.1);  border-color: rgba(255,100,100,0.25); color: #f7877e; }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 18px;
      backdrop-filter: blur(12px);
      animation: fadeUp 0.6s ease both;
      transition: transform 0.2s, border-color 0.2s;
    }
    .stat-card:hover { transform: translateY(-3px); border-color: rgba(126,184,247,0.25); }
    .stat-card:nth-child(1) { animation-delay: 0.05s; }
    .stat-card:nth-child(2) { animation-delay: 0.10s; }
    .stat-card:nth-child(3) { animation-delay: 0.15s; }
    .stat-card:nth-child(4) { animation-delay: 0.20s; }
    .stat-card:nth-child(5) { animation-delay: 0.25s; }
    .stat-card:nth-child(6) { animation-delay: 0.30s; }

    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .stat-icon { font-size: 1.3rem; margin-bottom: 6px; }
    .stat-value {
      font-size: 1.45rem;
      font-weight: 500;
      color: var(--text);
    }
    .stat-unit { font-size: 0.75rem; color: var(--muted); margin-left: 2px; }

    /* AQI bar */
    .aqi-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 24px;
      backdrop-filter: blur(12px);
      animation: fadeUp 0.6s 0.35s ease both;
    }
    .aqi-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .aqi-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
    }
    .aqi-value-badge {
      font-size: 0.82rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 100px;
      border: 1px solid;
    }
    .aqi-bar-bg {
      height: 8px;
      border-radius: 100px;
      background: linear-gradient(90deg, #4caf86, #e2c04a, #e27b4a, #e24a4a);
      position: relative;
      margin-bottom: 8px;
    }
    .aqi-needle {
      position: absolute;
      top: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px;
      background: #fff;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
      transition: left 1s cubic-bezier(.4,0,.2,1);
    }
    .aqi-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .main-card { padding: 26px 22px; }
    }
  </style>
</head>
<body>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="container">
    <header>
      <div class="logo">Atmosphera</div>
      <div class="tagline">Real-time weather intelligence</div>
    </header>

    <div class="search-wrap">
      <input type="text" id="cityInput" placeholder="Enter city or location…" autocomplete="off"/>
      <button onclick="fetchWeather()">Search</button>
    </div>

    <div class="error-msg" id="errorMsg">⚠ Location not found. Please try again.</div>
    <div class="spinner" id="spinner"><div class="ring"></div></div>

    <div class="weather-content" id="weatherContent">

      <div class="main-card">
        <div class="location-row">
          <div>
            <div class="location-name" id="cityName">—</div>
            <div class="location-region" id="regionName">—</div>
          </div>
          <div class="local-time" id="localTime">—</div>
        </div>
        <div class="temp-row">
          <div class="temp-big" id="tempC">—</div>
          <img class="weather-icon" id="weatherIcon" src="" alt="weather icon"/>
        </div>
        <div class="condition-text" id="conditionText">—</div>
        <div class="feels-like" id="feelsLike">—</div>
        <div id="conditionBadge"></div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">💧</div>
          <div class="stat-label">Humidity</div>
          <div class="stat-value" id="humidity">—<span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🌬️</div>
          <div class="stat-label">Wind</div>
          <div class="stat-value" id="wind">—<span class="stat-unit">km/h</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🌡️</div>
          <div class="stat-label">Pressure</div>
          <div class="stat-value" id="pressure">—<span class="stat-unit">mb</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">👁️</div>
          <div class="stat-label">Visibility</div>
          <div class="stat-value" id="visibility">—<span class="stat-unit">km</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">☁️</div>
          <div class="stat-label">Cloud Cover</div>
          <div class="stat-value" id="cloud">—<span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🌧️</div>
          <div class="stat-label">Precip.</div>
          <div class="stat-value" id="precip">—<span class="stat-unit">mm</span></div>
        </div>
      </div>

      <div class="aqi-section">
        <div class="aqi-header">
          <div class="aqi-title">Air Quality Index (PM2.5)</div>
          <div class="aqi-value-badge" id="aqiBadge">—</div>
        </div>
        <div class="aqi-bar-bg">
          <div class="aqi-needle" id="aqiNeedle" style="left:0%"></div>
        </div>
        <div class="aqi-labels">
          <span>Good</span><span>Moderate</span><span>Unhealthy</span><span>Hazardous</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_KEY = '465108f950a64e669f7120947260703';

    document.getElementById('cityInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') fetchWeather();
    });

    async function fetchWeather() {
      const city = document.getElementById('cityInput').value.trim();
      if (!city) return;

      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      document.getElementById('weatherContent').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';

      const weatherUrl = `https://api.weatherapi.com/v1/current.json?key=${API_KEY}&q=${encodeURIComponent(city)}&aqi=yes`;
      const proxyUrl  = `https://api.allorigins.win/get?url=${encodeURIComponent(weatherUrl)}`;

      try {
        const res     = await fetch(proxyUrl);
        const wrapper = await res.json();
        const d       = JSON.parse(wrapper.contents);

        if (d.error) throw new Error(d.error.message || 'Location not found.');

        renderWeather(d);
      } catch (err) {
        document.getElementById('spinner').style.display = 'none';
        errEl.textContent = '⚠ ' + (err.message || 'Something went wrong. Please try again.');
        errEl.style.display = 'block';
      }
    }

    function renderWeather(d) {
      const loc = d.location, cur = d.current;

      document.getElementById('cityName').textContent = loc.name;
      document.getElementById('regionName').textContent = `${loc.region ? loc.region + ', ' : ''}${loc.country}`;
      document.getElementById('localTime').innerHTML = loc.localtime.replace(' ', '<br>');

      document.getElementById('tempC').textContent = Math.round(cur.temp_c) + '°';
      document.getElementById('weatherIcon').src = 'https:' + cur.condition.icon;
      document.getElementById('weatherIcon').alt = cur.condition.text;
      document.getElementById('conditionText').textContent = cur.condition.text;
      document.getElementById('feelsLike').textContent = `Feels like ${Math.round(cur.feelslike_c)}°C  ·  ${cur.is_day ? 'Daytime' : 'Nighttime'}`;

      // Condition badge
      const badge = getBadge(cur.condition.text, cur.is_day);
      document.getElementById('conditionBadge').innerHTML = badge;

      // Stats
      document.getElementById('humidity').innerHTML   = cur.humidity + '<span class="stat-unit">%</span>';
      document.getElementById('wind').innerHTML       = cur.wind_kph + '<span class="stat-unit">km/h</span>';
      document.getElementById('pressure').innerHTML   = cur.pressure_mb + '<span class="stat-unit">mb</span>';
      document.getElementById('visibility').innerHTML = cur.vis_km + '<span class="stat-unit">km</span>';
      document.getElementById('cloud').innerHTML      = cur.cloud + '<span class="stat-unit">%</span>';
      document.getElementById('precip').innerHTML     = cur.precip_mm + '<span class="stat-unit">mm</span>';

      // AQI
      if (d.current.air_quality) {
        const pm25 = d.current.air_quality.pm2_5;
        const { label, color, pct } = getAQI(pm25);
        const aqiBadge = document.getElementById('aqiBadge');
        aqiBadge.textContent = `${pm25.toFixed(1)} µg/m³ — ${label}`;
        aqiBadge.style.color = color;
        aqiBadge.style.borderColor = color + '55';
        aqiBadge.style.background = color + '15';
        setTimeout(() => {
          document.getElementById('aqiNeedle').style.left = pct + '%';
        }, 300);
      }

      document.getElementById('spinner').style.display = 'none';
      document.getElementById('weatherContent').style.display = 'block';
    }

    function getBadge(condition, isDay) {
      const c = condition.toLowerCase();
      let cls = 'badge-cloudy', icon = '☁️', label = 'Cloudy';
      if (c.includes('sun') || c.includes('clear')) {
        cls = 'badge-sunny'; icon = isDay ? '☀️' : '🌙'; label = isDay ? 'Sunny' : 'Clear Night';
      } else if (c.includes('rain') || c.includes('drizzle') || c.includes('shower')) {
        cls = 'badge-rainy'; icon = '🌧️'; label = 'Rainy';
      } else if (c.includes('snow') || c.includes('sleet') || c.includes('blizzard')) {
        cls = 'badge-snowy'; icon = '❄️'; label = 'Snowy';
      } else if (c.includes('thunder') || c.includes('storm')) {
        cls = 'badge-stormy'; icon = '⛈️'; label = 'Stormy';
      } else if (c.includes('partly cloudy') || c.includes('overcast') || c.includes('mist') || c.includes('fog')) {
        cls = 'badge-cloudy'; icon = '🌫️'; label = 'Misty / Overcast';
      }
      return `<div class="condition-badge ${cls}">${icon} ${label}</div>`;
    }

    function getAQI(pm25) {
      if (pm25 <= 12)  return { label: 'Good',            color: '#4caf86', pct: Math.min((pm25/12)*16, 16) };
      if (pm25 <= 35)  return { label: 'Moderate',        color: '#e2c04a', pct: 16 + Math.min(((pm25-12)/23)*17, 17) };
      if (pm25 <= 55)  return { label: 'Unhealthy (Sensitive)', color: '#e2904a', pct: 33 + Math.min(((pm25-35)/20)*17, 17) };
      if (pm25 <= 150) return { label: 'Unhealthy',       color: '#e24a4a', pct: 50 + Math.min(((pm25-55)/95)*25, 25) };
      if (pm25 <= 250) return { label: 'Very Unhealthy',  color: '#9e4ae2', pct: 75 + Math.min(((pm25-150)/100)*15, 15) };
      return                   { label: 'Hazardous',      color: '#7e1a1a', pct: 95 };
    }

    // Auto-load London on start
    document.getElementById('cityInput').value = 'London';
    fetchWeather();
  </script>
</body>
</html>
